# Render Blueprint — EV Charging Assistant Backend
# Docs: https://render.com/docs/yaml-spec
#
# USAGE:
# 1. Push this repo to GitHub.
# 2. In Render Dashboard → New → Blueprint → connect your repo.
# 3. After service is created, go to Environment and set the three secret vars below.
# 4. Deploy.

services:
  - type: web
    name: ev-charging-assistant-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Binds to the PORT that Render injects (typically 10000 on free tier)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      # -----------------------------------------------------------------------
      # SECRET VARIABLES — do NOT put real values here; set them in the Render
      # Dashboard under Environment → Secret Files / Environment Variables.
      # -----------------------------------------------------------------------
      - key: GEMINI_API_KEY
        sync: false            # Must be set in Render Dashboard

      - key: GEMINI_MODEL
        sync: false            # e.g. gemini-2.0-flash

      - key: FRONTEND_URL
        sync: false            # e.g. https://YOUR_USERNAME.github.io
      # -----------------------------------------------------------------------
